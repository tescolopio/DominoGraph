[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dominograph"
version = "0.2.0"
description = "Local economic indicator explorer with a traceable synthetic dependency pilot"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "pydantic==2.14.1",
  "SQLAlchemy==2.0.54",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["httpx==0.28.1"]
postgres = ["psycopg[binary]==3.3.6"]

[tool.setuptools.packages.find]
include = ["core*", "schemas*", "collectors*", "transforms*", "agents*", "orchestration*", "api*", "scripts*", "data.examples"]

[tool.setuptools.package-data]
schemas = ["*.json"]
"data.examples" = ["*.csv"]
